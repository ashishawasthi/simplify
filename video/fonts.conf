<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- In the renderer's container: system-ui and sans-serif are Roboto, as on
     Android, with Noto Color Emoji for emoji. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Roboto</family><family>Noto Sans</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Roboto</family><family>Noto Sans</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias>
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
