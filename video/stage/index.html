<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="utf-8">
  <title>Video stage</title>
  <link rel="stylesheet" href="stage.css">
  <script type="module" src="stage.js"></script>
</head>
<body>
  <div id="stage">
    <div id="caption-band"></div>
    <div id="caption">
      <div id="cap-icon" class="icon"></div>
      <div>
        <div id="cap-title"></div>
        <div id="cap-line"></div>
      </div>
    </div>
    <div class="phone" id="phone-a"><div class="screen"><img class="shot" alt=""><div class="fx"></div></div></div>
    <div class="phone" id="phone-b"><div class="screen"><img class="shot" alt=""><div class="fx"></div></div></div>
    <div id="card">
      <img id="card-logo" alt="">
      <div id="card-icon" class="icon"></div>
      <div id="card-title"></div>
      <div id="card-line"></div>
      <div id="card-icons"></div>
    </div>
    <div id="progress"><div id="progress-fill"></div></div>
  </div>
</body>
</html>
