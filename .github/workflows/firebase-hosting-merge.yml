# A merge to main goes live, all of it, once the tests pass:
#   1. tests     the same as every pull request (tests.yml)
#   2. backend   Cloud Functions, Firestore rules and indexes, Storage rules
#   3. hosting   the website — only after the backend, so pages never go live
#                ahead of the rules or functions they need
# Run it again by hand (Actions → Run workflow) after fixing a failed deploy.

name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:
# one deploy at a time; a newer merge waits rather than cancelling one half done
concurrency:
  group: deploy-live
  cancel-in-progress: false
jobs:
  # the same tests as every pull request; nothing goes live if one fails
  tests:
    uses: ./.github/workflows/tests.yml
  deploy_backend:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # the CLI loads the functions' code to see what to deploy
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SIMPLIFY_SPECIAL }}
      # --force: a function or index no longer in the repository is deleted,
      # so the live backend is exactly what main says
      - run: >-
          npx --yes firebase-tools@15 deploy
          --only functions,firestore:rules,firestore:indexes,storage
          --project simplify-special --non-interactive --force
  build_and_deploy:
    needs: deploy_backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SIMPLIFY_SPECIAL }}
          channelId: live
          projectId: simplify-special
